FUNC void Getvalue(void)
{
		int i,j;
		j=0;
		exec("log > Data.log");//创建文件
 
		printf ("*****bo_buffer_01*****\n");//输出一段字符串
        //循环输出数组	
		for (i = 0; i < 256; i++) 
		{
			j ++;
			printf ("%x\n", current_IA[j]);
			if(i>=255)
			{
				printf ("*********256 bytes*********\n");
				i=0;	
			}
            //一秒1024个字节，2秒后跳出循环
			if(j == 1024*2)
			{
				break;
			}
			
		}
 
		exec("log off");//关闭文件
 
}